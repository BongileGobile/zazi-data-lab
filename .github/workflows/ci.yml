# WHY: Defines the automated CI/CD pipeline for the Zazi Data Lab project.
# This ensures every code push undergoes automated validation and syntax checks.
name: Zazi Data Lab CI

# WHY: Specifies when this workflow should automatically execute.
on:
  push:
    branches: [ main, master ] # WHY: Triggers on any direct push to main or master branches.
  pull_request:
    branches: [ main, master ] # WHY: Triggers on pull requests to ensure code review safety gates.

jobs:
  validate-pipeline:
    # WHY: Runs the job inside a fresh, isolated cloud virtual machine running Ubuntu.
    # This eliminates "it works on my machine" issues.
    runs-on: ubuntu-latest

    steps:
    # WHY: Pulls down the repository code into the runner's workspace.
    - name: Checkout Repository
      uses: actions/checkout@v4

    # WHY: Provisions Python 3.12 to match the local development runtime environment.
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # WHY: Installs core streaming pipeline dependencies to validate compatibility.
    - name: Upgrade Pip & Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # WHY: Acts as a static analysis gate. Compiles scripts to bytecode to catch 
    # syntax errors, missing imports, or indentation bugs before production deployment.
    - name: Static Code Syntax Check
      run: |
        python -m py_compile producer.py consumer.py
        echo "✅ All streaming pipeline scripts passed syntax compilation successfully!"
